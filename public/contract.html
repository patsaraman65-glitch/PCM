<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>สัญญา — PCM</title>
<link rel="stylesheet" href="/css/styles.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
.ct-wrap{max-width:900px;margin:0 auto;padding:28px 24px 80px}
.ct-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:12px}
.ct-head h1{font-size:24px;font-weight:800;color:var(--ink)}
/* contract document */
.doc{background:var(--white);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh);overflow:hidden}
.doc-band{background:var(--grad);color:#fff;padding:24px 32px}
.doc-band .no{font-family:'Inter';font-size:13px;opacity:.85}
.doc-band h2{font-size:22px;font-weight:800;margin-top:4px}
.doc-band .status{margin-top:8px}
.doc-body{padding:30px 32px}
.parties{display:grid;grid-template-columns:1fr auto 1fr;gap:20px;align-items:center;margin-bottom:28px}
.party{text-align:center;padding:18px;background:var(--bg);border-radius:var(--r)}
.party-avatar{width:52px;height:52px;border-radius:14px;margin:0 auto 10px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700}
.party-role{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.party strong{font-size:14px;display:block;margin-top:3px}
.party-vs{font-size:13px;color:var(--muted);font-weight:600}
.doc-section{margin-bottom:24px}
.doc-section h3{font-size:14px;font-weight:700;color:var(--ink);margin-bottom:12px;padding-bottom:8px;border-bottom:2px solid var(--line)}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.kv-item{padding:12px 14px;background:var(--bg);border-radius:10px}
.kv-item span{font-size:12px;color:var(--muted);display:block}
.kv-item b{font-size:15px;font-family:'Inter';color:var(--ink)}
.terms-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line-lt)}
.terms-row:last-child{border:none}
.terms-pct{width:54px;height:54px;border-radius:12px;background:var(--primary-50);color:var(--primary);display:flex;align-items:center;justify-content:center;font-weight:800;font-family:'Inter';font-size:16px;flex-shrink:0}
.terms-label{flex:1;font-size:14px}
.terms-amt{font-family:'Inter';font-weight:700;color:var(--ink)}
/* signatures */
.signs{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:10px}
.sign-box{border:2px dashed var(--line);border-radius:var(--r);padding:22px;text-align:center}
.sign-box.signed{border-style:solid;border-color:var(--green);background:#f0fdf4}
.sign-status{font-size:13px;color:var(--muted);margin-bottom:10px}
.sign-mark{font-family:'Brush Script MT',cursive;font-size:26px;color:var(--green);margin-bottom:6px}
@media(max-width:680px){.parties{grid-template-columns:1fr}.kv,.signs{grid-template-columns:1fr}.party-vs{display:none}}
</style>
</head>
<body data-page="dashboard">
<div id="nav"></div>
<div class="ct-wrap" id="wrap"><div style="text-align:center;padding:80px"><div class="spinner" style="margin:0 auto"></div></div></div>

<script src="/js/common.js"></script>
<script>
const PID=100; let C=null;
async function load(){
  C = await API.get('/contracts/'+PID);
  const c=C.contractor, col=colorOf(c.id);
  const start=C.start_date, end=C.start_date? new Date(new Date(C.start_date).getTime()+C.duration_days*864e5).toISOString().slice(0,10):'';
  document.getElementById('wrap').innerHTML=`
    <div class="ct-head">
      <h1>📜 สัญญาจ้างเหมาก่อสร้าง</h1>
      <div class="flex gap-2">
        <button class="btn btn-ghost btn-sm" onclick="exportPDF()">⬇ ส่งออก PDF</button>
        <a class="btn btn-soft btn-sm" href="/dashboard">← กลับ Dashboard</a>
      </div>
    </div>
    <div class="doc">
      <div class="doc-band">
        <div class="no">เลขที่สัญญา ${C.contract_no}</div>
        <h2>สัญญาจ้างเหมาก่อสร้างบ้านพักอาศัย</h2>
        <div class="status"><span class="badge" style="background:rgba(255,255,255,.9);color:var(--primary)">${C.status==='active'?'✓ สัญญามีผลแล้ว':C.status==='completed'?'เสร็จสมบูรณ์':'ร่างสัญญา'}</span></div>
      </div>
      <div class="doc-body">
        <div class="parties">
          <div class="party"><div class="party-avatar" style="background:#0ea5e9">${(C.project.owner_name||'จ').slice(-2)}</div>
            <div class="party-role">ผู้ว่าจ้าง</div><strong>${C.project.owner_name}</strong></div>
          <div class="party-vs">⟷</div>
          <div class="party"><div class="party-avatar" style="background:${col}">${initials(c.name)}</div>
            <div class="party-role">ผู้รับเหมา</div><strong>${c.name}</strong></div>
        </div>

        <div class="doc-section">
          <h3>รายละเอียดสัญญา</h3>
          <div class="kv">
            <div class="kv-item"><span>มูลค่าโครงการ</span><b>${Number(C.value).toLocaleString('th-TH')} บาท</b></div>
            <div class="kv-item"><span>ระยะเวลาก่อสร้าง</span><b>${C.duration_days} วัน</b></div>
            <div class="kv-item"><span>วันเริ่มสัญญา</span><b>${start||'-'}</b></div>
            <div class="kv-item"><span>กำหนดแล้วเสร็จ</span><b>${end||'-'}</b></div>
          </div>
          <p style="font-size:13.5px;color:var(--muted);margin-top:12px">📐 ${C.scope}</p>
        </div>

        <div class="doc-section">
          <h3>เงื่อนไขการชำระเงิน (${C.payment_terms.length} งวด)</h3>
          ${C.payment_terms.map(t=>`<div class="terms-row">
            <div class="terms-pct">${t.percent}%</div>
            <div class="terms-label">${t.label}</div>
            <div class="terms-amt">${Number(Math.round(C.value*t.percent/100)).toLocaleString('th-TH')} บ.</div>
          </div>`).join('')}
        </div>

        <div class="doc-section">
          <h3>การลงนาม (Digital Signature)</h3>
          <div class="signs">
            <div class="sign-box ${C.signed_owner?'signed':''}" id="sign-owner">
              ${C.signed_owner?`<div class="sign-mark">✓ ${C.project.owner_name}</div><div class="sign-status">ลงนามแล้ว</div>`
                :`<div class="sign-status">ผู้ว่าจ้างยังไม่ลงนาม</div><button class="btn btn-primary btn-sm" onclick="sign('owner')">✍️ ลงนาม</button>`}
            </div>
            <div class="sign-box ${C.signed_contractor?'signed':''}">
              ${C.signed_contractor?`<div class="sign-mark">✓ ${initials(c.name)}</div><div class="sign-status">ผู้รับเหมาลงนามแล้ว</div>`
                :`<div class="sign-status">ผู้รับเหมายังไม่ลงนาม</div>`}
            </div>
          </div>
        </div>
      </div>
    </div>`;
}
async function sign(who){
  await API.post('/contracts/'+C.id+'/sign',{who});
  toast('ลงนามเรียบร้อย ✓','success'); load();
}
function exportPDF(){
  const { jsPDF } = window.jspdf;
  const pdf=new jsPDF({unit:'mm',format:'a4'});
  pdf.setFillColor(37,99,235); pdf.rect(0,0,210,32,'F');
  pdf.setTextColor(255,255,255); pdf.setFontSize(16); pdf.text('PCM - Construction Contract',16,16);
  pdf.setFontSize(10); pdf.text('Contract No: '+C.contract_no,16,24);
  pdf.setTextColor(30,41,59); pdf.setFontSize(11);
  let y=46;
  const line=(k,v)=>{pdf.setFont('helvetica','bold');pdf.text(k,16,y);pdf.setFont('helvetica','normal');pdf.text(String(v),80,y);y+=8;};
  line('Owner:', C.project.owner_name);
  line('Contractor:', C.contractor.name);
  line('Value (THB):', Number(C.value).toLocaleString());
  line('Duration:', C.duration_days+' days');
  line('Start date:', C.start_date||'-');
  line('Status:', C.status);
  y+=4; pdf.setFont('helvetica','bold'); pdf.text('Payment Terms:',16,y); y+=8; pdf.setFont('helvetica','normal');
  C.payment_terms.forEach(t=>{ pdf.text(`${t.percent}%  -  ${Number(Math.round(C.value*t.percent/100)).toLocaleString()} THB`,20,y); y+=7; });
  pdf.save(C.contract_no+'.pdf');
  toast('ดาวน์โหลดสัญญา PDF แล้ว ✓','success');
}
load();
</script>
</body>
</html>
