<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>ผลการจับคู่ — PCM</title>
<link rel="stylesheet" href="/css/styles.css"/>
<style>
.results-wrap{max-width:1200px;margin:0 auto;padding:32px 24px 80px}

/* AI loading */
.ai-loading{text-align:center;padding:90px 20px}
.ai-orb{width:90px;height:90px;margin:0 auto 26px;border-radius:50%;background:var(--grad);position:relative;animation:pulse 1.6s ease-in-out infinite;box-shadow:var(--sh-blue)}
.ai-orb::after{content:'🤖';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:40px}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.08);opacity:.85}}
.ai-loading h2{font-size:24px;font-weight:800;color:var(--ink);margin-bottom:8px}
.ai-loading p{color:var(--muted)}
.ai-steps{max-width:340px;margin:26px auto 0;text-align:left}
.ai-step{display:flex;align-items:center;gap:11px;padding:9px 0;font-size:14px;color:var(--muted-lt);transition:all .3s}
.ai-step.on{color:var(--text);font-weight:500}
.ai-step .dot{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px}
.ai-step.on .dot{background:var(--green);border-color:var(--green);color:#fff}

/* project summary bar */
.proj-bar{background:var(--grad);border-radius:var(--r-lg);padding:22px 26px;color:#fff;margin-bottom:26px;display:flex;align-items:center;gap:26px;flex-wrap:wrap;box-shadow:var(--sh-blue)}
.proj-bar h3{font-size:18px;font-weight:700;margin-bottom:3px}
.proj-bar .tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.proj-bar .ptag{background:rgba(255,255,255,.18);padding:4px 12px;border-radius:20px;font-size:12.5px;font-weight:500}
.proj-bar .redo{margin-left:auto}

.results-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:12px}
.results-head h2{font-size:20px;font-weight:800;color:var(--ink)}

/* match card */
.match-list{display:flex;flex-direction:column;gap:16px}
.mcard{display:grid;grid-template-columns:auto 1fr auto;gap:22px;padding:22px;align-items:center}
.mcard.top{border:2px solid var(--primary);box-shadow:var(--sh-blue)}
.mcard-rank{position:relative}
.mavatar{width:74px;height:74px;border-radius:18px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:24px;font-family:'Inter'}
.rank-tag{position:absolute;-top:8px;top:-10px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:10px;font-weight:700;padding:2px 9px;border-radius:20px;white-space:nowrap}
.mcard.top .rank-tag{background:var(--grad)}
.mcard-info{min-width:0}
.mcard-name{font-size:17px;font-weight:700;color:var(--ink);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.mcard-tagline{font-size:13.5px;color:var(--muted);margin:3px 0 10px}
.mcard-meta{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.mcard-meta b{color:var(--ink);font-family:'Inter'}
.mcard-right{text-align:center;min-width:150px}
.score-ring{width:88px;height:88px;margin:0 auto 8px;position:relative}
.score-ring svg{transform:rotate(-90deg)}
.score-ring .val{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.score-ring .val b{font-size:26px;font-weight:800;font-family:'Inter';color:var(--primary);line-height:1}
.score-ring .val span{font-size:10px;color:var(--muted)}
.mcard-actions{display:flex;flex-direction:column;gap:7px;margin-top:6px}

/* breakdown bars */
.breakdown{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:14px;padding-top:14px;border-top:1px dashed var(--line)}
.bd-item{text-align:center}
.bd-bar{height:5px;border-radius:3px;background:var(--line);overflow:hidden;margin-bottom:5px}
.bd-fill{height:100%;border-radius:3px;background:var(--grad)}
.bd-label{font-size:10.5px;color:var(--muted)}
.bd-val{font-size:12px;font-weight:700;font-family:'Inter';color:var(--ink)}

/* compare floating bar */
.cmp-bar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);box-shadow:0 -6px 24px rgba(15,23,42,.1);padding:14px 24px;display:none;align-items:center;gap:16px;z-index:90}
.cmp-bar.show{display:flex}
.cmp-chips{display:flex;gap:8px;flex:1;flex-wrap:wrap}
.cmp-chip{display:flex;align-items:center;gap:7px;background:var(--primary-50);color:var(--primary);padding:6px 12px;border-radius:20px;font-size:13px;font-weight:600}
.cmp-chip .x{cursor:pointer}
.check-sel{width:24px;height:24px;border-radius:7px;border:2px solid var(--line);cursor:pointer;display:flex;align-items:center;justify-content:center;color:#fff;transition:all .2s}
.check-sel.on{background:var(--primary);border-color:var(--primary)}

@media(max-width:760px){
  .mcard{grid-template-columns:1fr;text-align:center}
  .mcard-meta{justify-content:center}
  .mcard-right{margin:0 auto}
  .breakdown{grid-template-columns:repeat(5,1fr)}
}
</style>
</head>
<body data-page="results">
<div id="nav"></div>

<div class="results-wrap">
  <!-- AI loading -->
  <div class="ai-loading" id="loading">
    <div class="ai-orb"></div>
    <h2>AI กำลังจับคู่ผู้รับเหมา</h2>
    <p>กำลังวิเคราะห์ความเหมาะสมจากปัจจัยทั้งหมด...</p>
    <div class="ai-steps">
      <div class="ai-step" data-i="0"><div class="dot"></div>วิเคราะห์ประเภทงานและสไตล์</div>
      <div class="ai-step" data-i="1"><div class="dot"></div>ตรวจสอบช่วงงบประมาณ</div>
      <div class="ai-step" data-i="2"><div class="dot"></div>คำนวณระยะทางและทำเล</div>
      <div class="ai-step" data-i="3"><div class="dot"></div>ประเมินผลงานและรีวิว</div>
      <div class="ai-step" data-i="4"><div class="dot"></div>จัดอันดับความเหมาะสม</div>
    </div>
  </div>

  <!-- results -->
  <div id="content" style="display:none">
    <div class="proj-bar" id="projBar"></div>
    <div class="results-head">
      <h2>🎯 ผู้รับเหมาที่เหมาะสมที่สุด <span id="cnt" class="badge badge-blue"></span></h2>
      <a class="btn btn-ghost btn-sm" href="/create-project">+ สร้างโปรเจกต์ใหม่</a>
    </div>
    <div class="match-list" id="matchList"></div>
  </div>
</div>

<!-- compare floating bar -->
<div class="cmp-bar" id="cmpBar">
  <strong style="font-size:14px">เปรียบเทียบ:</strong>
  <div class="cmp-chips" id="cmpChips"></div>
  <button class="btn btn-ghost btn-sm" onclick="clearCompare()">ล้าง</button>
  <button class="btn btn-primary btn-sm" onclick="goCompare()">เปรียบเทียบ →</button>
</div>

<script src="/js/common.js"></script>
<script>
const BD = [
  {k:'workType',l:'ประเภทงาน',max:30},{k:'budget',l:'งบประมาณ',max:20},
  {k:'distance',l:'ระยะทาง',max:15},{k:'portfolio',l:'ผลงาน',max:20},{k:'review',l:'รีวิว',max:15},
];
let selected = Store.get('compare', []);

function ringSvg(score){
  const r=38, c=2*Math.PI*r, off=c*(1-score/100);
  return `<svg width="88" height="88"><circle cx="44" cy="44" r="${r}" fill="none" stroke="#e2e8f0" stroke-width="7"/>
    <circle cx="44" cy="44" r="${r}" fill="none" stroke="url(#g)" stroke-width="7" stroke-linecap="round"
      stroke-dasharray="${c}" stroke-dashoffset="${off}"/>
    <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2563eb"/><stop offset="1" stop-color="#4f46e5"/></linearGradient></defs></svg>`;
}

async function run(){
  const pid = Store.get('projectId');
  if(!pid){ location.href='/create-project'; return; }

  // animate ai steps
  const steps=document.querySelectorAll('.ai-step');
  let i=0;
  const timer=setInterval(()=>{ if(i<steps.length){ steps[i].classList.add('on'); steps[i].querySelector('.dot').textContent='✓'; i++; } }, 420);

  const [data] = await Promise.all([
    API.get('/projects/'+pid+'/matches'),
    new Promise(r=>setTimeout(r,2300)),
  ]);
  clearInterval(timer); steps.forEach(s=>{s.classList.add('on');s.querySelector('.dot').textContent='✓';});

  setTimeout(()=>render(data), 300);
}

function render(data){
  document.getElementById('loading').style.display='none';
  document.getElementById('content').style.display='block';
  const p=data.project;

  document.getElementById('projBar').innerHTML=`
    <div>
      <h3>โปรเจกต์ของคุณ</h3>
      <div class="tags">
        <span class="ptag">🏗 ${p.work_type}</span>
        <span class="ptag">💰 ${fmtBudget(p.budget_min,p.budget_max)}</span>
        ${p.style?`<span class="ptag">🎨 ${p.style}</span>`:''}
        ${p.province?`<span class="ptag">📍 ${p.province}</span>`:''}
        ${p.area?`<span class="ptag">📐 ${p.area} ตร.ม.</span>`:''}
      </div>
    </div>
    <a class="btn btn-white btn-sm redo" href="/create-project">แก้ไขโปรเจกต์</a>`;

  document.getElementById('cnt').textContent = data.results.length+' ราย';

  document.getElementById('matchList').innerHTML = data.results.map((m,idx)=>{
    const c=m.contractor, col=colorOf(c.id);
    const rankLabel = idx===0?'🏆 เหมาะสมที่สุด':idx===1?'อันดับ 2':idx===2?'อันดับ 3':'อันดับ '+(idx+1);
    return `<div class="card mcard ${idx===0?'top':''} fade-up" style="animation-delay:${idx*.05}s">
      <div class="mcard-rank">
        <div class="mavatar" style="background:${col}">${initials(c.name)}</div>
        <div class="rank-tag">${rankLabel}</div>
      </div>
      <div class="mcard-info">
        <div class="mcard-name">${c.name} ${c.verified?'<span class="badge badge-verified">✓ ตรวจสอบแล้ว</span>':''}</div>
        <div class="mcard-tagline">${c.tagline}</div>
        <div class="mcard-meta">
          <span>${stars(c.rating)} <b>${c.rating}</b> (${c.review_count})</span>
          <span>📁 <b>${c.projects_done}</b> ผลงาน</span>
          <span>📍 ${c.province}${m.distanceKm!=null?` · <b>${m.distanceKm}</b> กม.`:''}</span>
          <span>🛡 รับประกัน <b>${c.warranty_years}</b> ปี</span>
        </div>
        <div class="breakdown">
          ${BD.map(b=>{const v=m.breakdown[b.k];return `<div class="bd-item">
            <div class="bd-bar"><div class="bd-fill" style="width:${v/b.max*100}%"></div></div>
            <div class="bd-val">${v}/${b.max}</div><div class="bd-label">${b.l}</div></div>`;}).join('')}
        </div>
      </div>
      <div class="mcard-right">
        <div class="score-ring">${ringSvg(m.score)}<div class="val"><b>${m.score}</b><span>เหมาะสม</span></div></div>
        <div class="mcard-actions">
          <a class="btn btn-primary btn-sm" href="/profile?id=${c.id}">ดูโปรไฟล์</a>
          <a class="btn btn-soft btn-sm" href="/rfq?c=${c.id}">ขอใบเสนอราคา</a>
          <div class="flex gap-2" style="justify-content:center;align-items:center;font-size:12px;color:var(--muted);cursor:pointer" onclick="toggleCompare(${c.id},'${c.name.replace(/'/g,'')}')">
            <span class="check-sel ${selected.find(s=>s.id===c.id)?'on':''}" id="chk_${c.id}">✓</span> เทียบ
          </div>
        </div>
      </div>
    </div>`;
  }).join('');
  renderCmpBar();
}

function toggleCompare(id,name){
  const i=selected.findIndex(s=>s.id===id);
  if(i>=0) selected.splice(i,1);
  else { if(selected.length>=4){toast('เปรียบเทียบได้สูงสุด 4 ราย');return;} selected.push({id,name}); }
  Store.set('compare',selected);
  document.getElementById('chk_'+id)?.classList.toggle('on');
  renderCmpBar();
}
function clearCompare(){ selected=[];Store.set('compare',[]);document.querySelectorAll('.check-sel').forEach(c=>c.classList.remove('on'));renderCmpBar(); }
function renderCmpBar(){
  const bar=document.getElementById('cmpBar');
  bar.classList.toggle('show', selected.length>0);
  document.getElementById('cmpChips').innerHTML = selected.map(s=>`<span class="cmp-chip">${s.name.slice(0,22)} <span class="x" onclick="toggleCompare(${s.id},'')">✕</span></span>`).join('');
}
function goCompare(){ if(selected.length<2){toast('เลือกอย่างน้อย 2 ราย');return;} location.href='/compare'; }

run();
</script>
</body>
</html>
