<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>ส่งมอบงาน — PCM</title>
<link rel="stylesheet" href="/css/styles.css"/>
<style>
.ho-wrap{max-width:780px;margin:0 auto;padding:28px 24px 80px}
.ho-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;flex-wrap:wrap;gap:12px}
.ho-head h1{font-size:24px;font-weight:800;color:var(--ink)}
.ho-sub{color:var(--muted);margin-bottom:22px}
/* progress ring banner */
.ho-banner{background:var(--white);border:1px solid var(--line);border-radius:var(--r-lg);padding:24px;display:flex;align-items:center;gap:24px;margin-bottom:22px;box-shadow:var(--sh-sm)}
.ho-ring{width:96px;height:96px;position:relative;flex-shrink:0}
.ho-ring svg{transform:rotate(-90deg)}
.ho-ring .v{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ho-ring .v b{font-size:24px;font-weight:800;font-family:'Inter';color:var(--primary)}
.ho-banner-text strong{font-size:18px;display:block}
.ho-banner-text p{font-size:14px;color:var(--muted);margin-top:4px}
/* checklist */
.check-item{display:flex;align-items:center;gap:14px;padding:16px 18px;background:var(--white);border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px;transition:all .2s}
.check-item.approved{background:#f0fdf4;border-color:#bbf7d0}
.check-box{width:28px;height:28px;border-radius:8px;border:2px solid var(--line);cursor:pointer;display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px;flex-shrink:0;transition:all .2s}
.check-box.on{background:var(--green);border-color:var(--green)}
.check-label{flex:1;font-size:14.5px;font-weight:500}
.check-item.approved .check-label{color:var(--green)}
.ho-done-banner{background:#ecfdf5;border:1px solid #6ee7b7;border-radius:var(--r-lg);padding:24px;text-align:center;margin-top:20px;display:none}
.ho-done-banner.show{display:block}
</style>
</head>
<body data-page="dashboard">
<div id="nav"></div>
<div class="ho-wrap" id="wrap"><div style="text-align:center;padding:80px"><div class="spinner" style="margin:0 auto"></div></div></div>

<script src="/js/common.js"></script>
<script>
const PID=100; let items=[];
function ring(pct){const r=42,c=2*Math.PI*r,off=c*(1-pct/100);
  return `<svg width="96" height="96"><circle cx="48" cy="48" r="${r}" fill="none" stroke="#e2e8f0" stroke-width="8"/>
    <circle cx="48" cy="48" r="${r}" fill="none" stroke="#10b981" stroke-width="8" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}"/></svg>`;}
async function load(){
  const w = await API.get('/workspace/'+PID);
  items = w.handover;
  render();
}
function render(){
  const done=items.filter(i=>i.status==='approved').length;
  const pct=Math.round(done/items.length*100);
  document.getElementById('wrap').innerHTML=`
    <div class="ho-head"><h1>📦 จัดการส่งมอบงาน (Handover)</h1><a class="btn btn-soft btn-sm" href="/dashboard">← กลับ Dashboard</a></div>
    <div class="ho-sub">ตรวจรับเอกสารและรายการส่งมอบงานก่อนปิดโครงการ</div>
    <div class="ho-banner">
      <div class="ho-ring">${ring(pct)}<div class="v"><b class="num">${pct}%</b></div></div>
      <div class="ho-banner-text"><strong>ตรวจรับแล้ว ${done} / ${items.length} รายการ</strong>
        <p>${pct===100?'✅ ครบทุกรายการ พร้อมปิดงานและให้คะแนนรีวิว':'ติ๊กรายการที่ตรวจรับเรียบร้อยแล้ว'}</p></div>
    </div>
    ${items.map(it=>`<div class="check-item ${it.status==='approved'?'approved':''}">
      <div class="check-box ${it.status==='approved'?'on':''}" onclick="toggle(${it.id},'${it.status}')">${it.status==='approved'?'✓':''}</div>
      <div class="check-label">${it.name}</div>
      ${it.status==='approved'?'<span class="badge badge-green">ตรวจรับแล้ว</span>':'<span class="badge badge-gray">รอตรวจรับ</span>'}
    </div>`).join('')}
    <div class="ho-done-banner ${pct===100?'show':''}">
      <div style="font-size:40px">🎉</div>
      <h2 style="font-size:20px;font-weight:800;margin:8px 0">ส่งมอบงานครบถ้วน!</h2>
      <p style="color:var(--muted);margin-bottom:16px">โครงการพร้อมปิดงาน อย่าลืมให้คะแนนรีวิวผู้รับเหมา</p>
      <a class="btn btn-primary" href="/review">⭐ ให้คะแนนรีวิว →</a>
    </div>`;
}
async function toggle(id,cur){
  const next=cur==='approved'?'pending':'approved';
  await API.put('/handover/'+id,{status:next});
  const it=items.find(x=>x.id===id); it.status=next;
  render();
}
load();
</script>
</body>
</html>
